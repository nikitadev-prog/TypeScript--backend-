services:
  - type: web
    name: digital-card-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-card-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"

databases:
  - name: digital-card-db
    plan: free
    databaseName: digitalcard
    user: digitalcard
